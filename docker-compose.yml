version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fizyoblu_postgres
    restart: always
    environment:
      POSTGRES_DB: fizyoblu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./fizyoblu-backend
      dockerfile: Dockerfile
    container_name: fizyoblu_api
    restart: always
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_URL=Host=db;Port=5432;Database=fizyoblu_db;Username=postgres;Password=postgrespassword
      - FrontendUrl=http://localhost:5173
    ports:
      - "5005:8080"
    volumes:
      - backend_uploads:/app/wwwroot/uploads

volumes:
  postgres_data:
  backend_uploads:
